<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Login - Fake News Detector">
    <title>Admin Login - Fake News Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="{{ url_for('home') }}" class="nav-brand">📰 Fake News Detector</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div class="login-section">
            <h1>Admin Login</h1>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="card login-card">
                <form action="{{ url_for('admin_login') }}" method="POST">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-input"
                            placeholder="Enter username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="Enter password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" id="login-btn">
                        Login
                    </button>
                </form>
            </div>

            <a href="{{ url_for('home') }}" class="back-link">← Back to Home</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>Fake News Detector &mdash; College Project &copy; 2026</p>
        </div>
    </footer>
</body>
</html>
